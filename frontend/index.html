<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f4e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1a15" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Veridion is a digital trust intelligence platform that analyses websites across multiple security layers and explains the evidence behind every assessment."
    />
    <title>Veridion | Digital Trust Intelligence</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('veridion-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
